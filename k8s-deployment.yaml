apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-project
  template:
    metadata:
      labels:
        app: devops-project
    spec:
      containers:
        - name: devops-project
          image: devops-project:1.0.0
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: devops-project-config
            - secretRef:
                name: devops-project-secret
          ports:
            - containerPort: 8080
